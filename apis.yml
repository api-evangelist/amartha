aid: amartha
name: Amartha
description: 'Amartha (PT Amartha Mikro Fintek, operating as Amartha Financial Group)
  is an Indonesian technology company founded in 2010 that builds digital financial
  infrastructure for the grassroots economy, connecting micro-entrepreneurs — predominantly
  women running micro and small businesses in rural villages — with affordable working
  capital from retail and institutional funders. Its consumer and agent brands include
  Amartha Prosper (investment), Celengan (savings), Modal (group loans), AmarthaLink
  (agent network) and the AmarthaFin mobile app for payments and bill purchase, alongside
  two business lines — Institutional Investments and Embedded Lending — that let banks,
  non-bank financial institutions, insurers and technology partners channel loans to
  Amartha borrowers. The company is headquartered at Amartha Village in South Jakarta,
  and runs its social impact programs through Amartha.org.'
